<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nursing reports · Tibbi Orbit</title>
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script><script src="../assets/data.js"></script><script src="../assets/data-core.js"></script><script src="../assets/data-settings.js"></script><script src="../assets/data-nursing.js"></script><script src="../assets/ui.js"></script><script src="../assets/kit.js"></script><script src="../assets/nursing.js"></script>
</head>
<body>
<script>
(function () {
  const { db, $ } = UI;
  if (!UI.page({ opt: 'nursing.reports', title: 'Nursing reports', subtitle: 'Ward census, vital signs, fluid balance, medication administration, risk scores, order execution and consumption.' })) return;
  const WARD = { id: 'ward', label: 'Ward', type: 'select', options: db.wards.map(w => [w.id, w.name]) };
  const FROM = { id: 'from', label: 'From', type: 'date', value: Kit.addDays(db.TODAY, -7) }, TO = { id: 'to', label: 'To', type: 'date' };
  const wardOfEnc = (id) => { const e = Kit.enc(id); return e && e.bedId ? (Kit.bed(e.bedId) || {}).wardId : ''; };
  const inWard = (encId, f) => !f.ward || wardOfEnc(encId) === f.ward;
  const inRange = (at, f) => (!f.from || at.slice(0, 10) >= f.from) && (!f.to || at.slice(0, 10) <= f.to);
  const bedPt = (encId) => { const e = Kit.enc(encId) || {}; return [Nursing.bedNo(e), Kit.ptName(e.patientId), (Kit.pt(e.patientId) || {}).mrn]; };
  const medName = (m) => { const o = Kit.by('orders', m.orderId) || {}; return (Kit.item(o.itemId) || {}).generic || o.name || ''; };
  const ipdEncs = (f) => db.encounters.filter(e => e.type === 'IPD' && inWard(e.id, f));

  Kit.reportCatalog($('#page'), { opt: 'nursing.reports', reports: [
    { id: 'nr01', title: 'Ward census', purpose: 'Inpatients by ward and bed with length of stay, diagnosis and expected discharge.', filters: [WARD, { id: 'st', label: 'Status', type: 'select', options: [['Admitted', 'Admitted'], ['Discharge planned', 'Discharge planned']] }],
      columns: ['Ward', 'Bed', 'Patient', 'MRN', 'Admitted', 'LOS (days)', 'Diagnosis', 'Doctor', 'Expected discharge', 'Status'],
      rows: (f) => Nursing.inpatients(f.ward).filter(e => !f.st || e.status === f.st).map(e => [Nursing.wardOf(e).code, Nursing.bedNo(e), Kit.ptName(e.patientId), (Kit.pt(e.patientId) || {}).mrn, e.start, Nursing.losDays(e), e.diagnosis + ' ' + e.reason, Kit.docName(e.doctorId), e.expectedDischarge, e.status]),
      totals: (r) => ['Total', '', r.length + ' patients', '', '', r.length ? +(Kit.sumBy(r, x => x[5]) / r.length).toFixed(1) : 0, '', '', '', ''] },
    { id: 'nr02', title: 'Abnormal vital signs log', purpose: 'Readings outside the normal range, for escalation review.', filters: [FROM, TO, WARD, { id: 'p', label: 'Parameter', type: 'select', options: [['temp', 'Temperature'], ['hr', 'Heart rate'], ['sbp', 'Blood pressure'], ['rr', 'Respiratory rate'], ['spo2', 'SpO2']] }],
      columns: ['Time', 'Bed', 'Patient', 'MRN', 'Abnormal values', 'Recorded by'],
      rows: (f) => db.vitals.filter(v => v.at <= Nursing.now() && inRange(v.at, f) && Kit.enc(v.encounterId) && Kit.enc(v.encounterId).type === 'IPD' && inWard(v.encounterId, f) && Nursing.vitalAbn(v).length && (!f.p || Nursing.vitalAbn(v).includes(f.p))).sort((a, b) => b.at.localeCompare(a.at)).map(v => [v.at].concat(bedPt(v.encounterId)).concat([Nursing.abnText(v), v.by])) },
    { id: 'nr03', title: 'Fluid balance summary', purpose: 'Intake, output and balance per patient per nursing day (07:00 to 07:00).', filters: [FROM, TO, WARD],
      columns: ['Nursing day', 'Bed', 'Patient', 'MRN', 'Intake (mL)', 'Output (mL)', 'Balance (mL)'],
      rows: (f) => { const out = []; ipdEncs(f).forEach(e => { const g = Kit.groupBy(Nursing.ioOf(e.id), x => Nursing.shiftDay(x.at)); Object.keys(g).sort().forEach(d => { if (!inRange(d, f)) return; const t = Nursing.ioTotals(g[d]); out.push([d].concat(bedPt(e.id)).concat([t.intake, t.output, t.balance])); }); }); return out; },
      totals: (r) => ['Total', '', '', '', Kit.sumBy(r, x => x[4]), Kit.sumBy(r, x => x[5]), Kit.sumBy(r, x => x[6])] },
    { id: 'nr04', title: 'Medication administration log', purpose: 'Every administration event with nurse, second nurse and timing.', filters: [FROM, TO, WARD, { id: 'st', label: 'Status', type: 'select', options: [['Given', 'Given'], ['Held', 'Held'], ['Refused', 'Refused'], ['Missed', 'Missed']] }],
      columns: ['Time', 'Scheduled', 'Bed', 'Patient', 'MRN', 'Medicine', 'Dose', 'Route', 'Status', 'Nurse', 'Second nurse'],
      rows: (f) => db.nursingMar.filter(m => inRange(m.at, f) && inWard(m.encounterId, f) && (!f.st || m.status === f.st)).sort((a, b) => b.at.localeCompare(a.at)).map(m => [m.at, m.due ? Kit.time(m.due) : 'PRN'].concat(bedPt(m.encounterId)).concat([medName(m), m.dose, m.route, m.status, m.by, m.witness || ''])) },
    { id: 'nr05', title: 'Missed, held and refused doses', purpose: 'Doses not given with the reason, plus doses given more than 60 minutes late.', filters: [FROM, TO, WARD, { id: 'k', label: 'Type', type: 'select', options: [['Missed', 'Missed'], ['Held', 'Held'], ['Refused', 'Refused'], ['Late', 'Given late']] }],
      columns: ['Scheduled', 'Recorded', 'Bed', 'Patient', 'MRN', 'Medicine', 'Type', 'Reason', 'Nurse'],
      rows: (f) => db.nursingMar.filter(m => m.due && inRange(m.due, f) && inWard(m.encounterId, f)).map(m => Object.assign({ k: m.status === 'Given' ? (Nursing.minsBetween(m.due, m.at) > 60 ? 'Late' : '') : m.status }, m)).filter(m => m.k && (!f.k || m.k === f.k)).sort((a, b) => b.due.localeCompare(a.due)).map(m => [m.due, m.at].concat(bedPt(m.encounterId)).concat([medName(m), m.k === 'Late' ? 'Given ' + Nursing.minsBetween(m.due, m.at) + ' min late' : m.k, m.reason || m.note || '', m.by])) },
    { id: 'nr06', title: 'High-alert medicine double-check log', purpose: 'Opioid, insulin and anticoagulant doses with the second nurse who checked them.', filters: [FROM, TO, WARD, { id: 'c', label: 'Class', type: 'select', options: [['Opioid', 'Opioid'], ['Insulin', 'Insulin'], ['Anticoagulant', 'Anticoagulant']] }],
      columns: ['Time', 'Bed', 'Patient', 'MRN', 'Medicine', 'Class', 'Dose', 'Nurse', 'Second nurse', 'Check'],
      rows: (f) => db.nursingMar.filter(m => { const o = Kit.by('orders', m.orderId) || {}; const it = Kit.item(o.itemId); return m.status === 'Given' && Nursing.isHighAlert(it) && inRange(m.at, f) && inWard(m.encounterId, f) && (!f.c || Nursing.highAlertKind(it) === f.c); }).sort((a, b) => b.at.localeCompare(a.at)).map(m => { const it = Kit.item((Kit.by('orders', m.orderId) || {}).itemId); return [m.at].concat(bedPt(m.encounterId)).concat([medName(m), Nursing.highAlertKind(it), m.dose, m.by, m.witness || '', m.witness ? 'Done' : 'Missing']); }) },
    { id: 'nr07', title: 'Fall risk (Morse) report', purpose: 'Latest Morse score per inpatient with the risk level and fall precautions order.', filters: [WARD, { id: 'lv', label: 'Risk level', type: 'select', options: [['High risk', 'High risk'], ['Moderate risk', 'Moderate risk'], ['Low risk', 'Low risk']] }],
      columns: ['Bed', 'Patient', 'MRN', 'Morse score', 'Risk level', 'Assessed', 'By', 'Fall precautions order'],
      rows: (f) => Nursing.inpatients(f.ward).map(e => ({ e, a: Nursing.lastWith(e.id, 'morseScore') })).filter(x => x.a && (!f.lv || Nursing.morseLevel(x.a.morseScore)[0] === f.lv)).map(x => bedPt(x.e.id).concat([x.a.morseScore, Nursing.morseLevel(x.a.morseScore)[0], x.a.at, x.a.by, db.nursingNurseOrders.some(n => n.encounterId === x.e.id && n.status === 'Active' && /Fall/.test(n.name)) || db.orders.some(o => o.encounterId === x.e.id && o.status === 'Active' && /Fall/.test(o.name)) ? 'Yes' : 'No'])) },
    { id: 'nr08', title: 'Pressure injury risk (Braden) report', purpose: 'Latest Braden score per inpatient, skin findings and repositioning orders.', filters: [WARD, { id: 'mx', label: 'Score at or below', type: 'select', options: [['12', '12 (high risk)'], ['14', '14 (moderate)'], ['18', '18 (at risk)']] }],
      columns: ['Bed', 'Patient', 'MRN', 'Braden score', 'Risk level', 'Skin finding', 'Assessed', 'Repositioning order'],
      rows: (f) => Nursing.inpatients(f.ward).map(e => ({ e, a: Nursing.lastWith(e.id, 'bradenScore') })).filter(x => x.a && (!f.mx || x.a.bradenScore <= +f.mx)).map(x => bedPt(x.e.id).concat([x.a.bradenScore, Nursing.bradenLevel(x.a.bradenScore)[0], x.a.skin || 'None', x.a.at, db.nursingNurseOrders.some(n => n.encounterId === x.e.id && n.status === 'Active' && /reposition/i.test(n.name)) ? 'Yes' : 'No'])) },
    { id: 'nr09', title: 'Order execution compliance', purpose: 'Order tasks done on time, done late (over 60 minutes) and not done, per patient.', filters: [FROM, TO, WARD, { id: 't', label: 'Order type', type: 'select', options: Object.entries(Nursing.TYPE_LABEL) }],
      columns: ['Bed', 'Patient', 'MRN', 'Tasks recorded', 'On time', 'Late', 'Not done', 'On time %'],
      rows: (f) => ipdEncs(f).map(e => { const l = db.nursingTaskLog.filter(x => x.encounterId === e.id && inRange(x.due, f) && (!f.t || (f.t === 'nursing' ? /^nno/.test(x.orderId) : (Kit.by('orders', x.orderId) || {}).type === f.t))); const done = l.filter(x => x.outcome === 'Done'); const late = done.filter(x => Nursing.minsBetween(x.due, x.at) > 60).length; return l.length ? bedPt(e.id).concat([l.length, done.length - late, late, l.length - done.length, Math.round(100 * (done.length - late) / l.length)]) : null; }).filter(Boolean),
      totals: (r) => ['Total', '', '', Kit.sumBy(r, x => x[3]), Kit.sumBy(r, x => x[4]), Kit.sumBy(r, x => x[5]), Kit.sumBy(r, x => x[6]), r.length ? Math.round(100 * Kit.sumBy(r, x => x[4]) / Math.max(1, Kit.sumBy(r, x => x[3]))) : 0] },
    { id: 'nr10', title: 'Item consumption report', purpose: 'Patient and departmental consumption by item, with billed amounts and batches.', filters: [FROM, TO, { id: 'k', label: 'Type', type: 'select', options: [['Patient', 'Patient'], ['Department', 'Departmental']] }, { id: 'b', label: 'Billing', type: 'select', options: [['y', 'Billed'], ['n', 'Not billed']] }],
      columns: ['Date', 'Number', 'Type', 'Patient or cost centre', 'Item', 'Qty', 'Batches', 'Billed (KWD)', 'By'],
      rows: (f) => db.nursingConsumption.filter(c => c.status === 'Posted' && inRange(c.at, f) && (!f.k || c.kind === f.k)).reduce((out, c) => out.concat(c.lines.filter(l => !f.b || (f.b === 'y') === !!l.billable).map(l => [c.at, c.no, c.kind, c.kind === 'Patient' ? Kit.ptName(c.patientId) : c.costCentre, (Kit.item(l.itemId) || {}).name, l.qty, l.batches.map(b => b.batch).join(', '), l.amount || 0, c.by])), []),
      totals: (r) => ['Total', '', '', '', '', Kit.sumBy(r, x => x[5]), '', +Kit.sumBy(r, x => x[7]).toFixed(3), ''] },
  ] });
})();
</script>
</body>
</html>
