<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy reports · Tibbi Orbit</title>
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script><script src="../assets/data.js"></script><script src="../assets/data-core.js"></script><script src="../assets/data-pharmacy.js"></script><script src="../assets/ui.js"></script><script src="../assets/kit.js"></script><script src="../assets/pharmacy.js"></script>
</head>
<body>
<script>
(function () {
  const { db, $ } = UI;
  const P = Pharmacy, T = db.TODAY;
  if (!UI.page({ opt: 'pharmacy.reports', title: 'Pharmacy reports', subtitle: 'Ten operational reports for dispensing, stock, controlled drugs and revenue. Export to Excel (CSV) or print.' })) return;

  const D = (r, v) => (!v.from || r >= v.from) && (!v.to || r <= v.to + ' 23:59');
  const from = { id: 'from', label: 'From', type: 'date' }, to = { id: 'to', label: 'To', type: 'date' };
  const store = { id: 'wh', label: 'Store', type: 'select', options: [[P.WH.OPD, 'Outpatient Pharmacy'], [P.WH.IPD, 'Inpatient Pharmacy']] };
  const it = (id) => Kit.item(id) || {};
  const people = (list, f) => Array.from(new Set(list.map(f).filter(Boolean))).sort().map(x => [x, x]);
  const disp = () => db.pharmacyDispenses.filter(d => d.status !== 'Voided');
  const dispWh = (d) => d.setting === 'IPD' ? P.WH.IPD : P.WH.OPD;
  const shareOf = (d) => { const inv = db.invoices.find(x => x.id === d.invoiceId); if (inv) return [inv.patientAmount, inv.payerAmount, inv.payerId]; const p = Kit.pt(d.patientId) || {}; const pl = p.planId ? Kit.plan(p.planId) : null; const pat = pl ? Math.min(d.total * pl.copayPct / 100, pl.maxCopay || d.total) : d.total; return [pat, d.total - pat, pl ? pl.payerId : null]; };
  const cats = Array.from(new Set(db.items.filter(i => i.type === 'Drug').map(i => i.category))).sort().map(c => [c, c]);
  const sum = (rows, i) => rows.reduce((s, r) => s + (Number(r[i]) || 0), 0);

  Kit.reportCatalog($('#page'), { module: 'pharmacy', opt: 'pharmacy.reports', reports: [
    { id: 'PHR-01', title: 'Dispensing register', purpose: 'Every dispensing and inpatient supply with items, quantities and pharmacist.',
      filters: [from, to, { id: 'set', label: 'Setting', type: 'select', options: [['OPD', 'OPD'], ['IPD', 'IPD']] }, { id: 'by', label: 'Pharmacist', type: 'select', options: people(db.pharmacyDispenses, d => d.by) }],
      columns: ['Date', 'Dispense no', 'Setting', 'Prescription / admission', 'Patient', 'MRN', 'Items', 'Quantity', 'Amount (KWD)', 'Pharmacist'],
      rows: v => disp().filter(d => D(d.at, v) && (!v.set || d.setting === v.set) && (!v.by || d.by === v.by)).sort((a, b) => b.at.localeCompare(a.at)).map(d => [Kit.day(d.at) + ' ' + Kit.time(d.at), d.no, d.setting, d.rxNo || (Kit.enc(d.encounterId) || {}).no || '', Kit.ptName(d.patientId), (Kit.pt(d.patientId) || {}).mrn || '', d.lines.length, Kit.sumBy(d.lines, l => l.qty), +d.total.toFixed(3), d.by]),
      totals: r => ['Total', r.length + ' records', '', '', '', '', sum(r, 6), sum(r, 7), +sum(r, 8).toFixed(3), ''] },
    { id: 'PHR-02', title: 'OPD prescription turnaround', purpose: 'Minutes from prescription to hand-over against the 30 minute target.',
      filters: [from, to, { id: 'doc', label: 'Prescriber', type: 'select', options: db.doctors.filter(d => d.clinicId).map(d => [d.id, d.name]) }, { id: 'tgt', label: 'Target', type: 'select', options: [['in', 'Within 30 min'], ['out', 'Over 30 min']] }],
      columns: ['Prescription', 'Patient', 'Prescriber', 'Prescribed', 'Dispensed', 'Minutes', 'Within target'],
      rows: v => P.prescriptions().filter(r => r.status === 'Dispensed' && D(r.orderedAt, v) && (!v.doc || r.doctorId === v.doc) && (!v.tgt || (r.wait <= 30) === (v.tgt === 'in'))).map(r => [r.rxNo, Kit.ptName(r.patientId), Kit.docName(r.doctorId), Kit.time(r.orderedAt), Kit.time(r.dispensedAt), r.wait, r.wait <= 30 ? 'Yes' : 'No']),
      totals: r => ['Average', r.length + ' prescriptions', '', '', '', r.length ? Math.round(sum(r, 5) / r.length) : 0, r.length ? Math.round(100 * r.filter(x => x[6] === 'Yes').length / r.length) + '% within' : ''] },
    { id: 'PHR-03', title: 'Drug consumption by item', purpose: 'Quantities dispensed and sold per item, with value at selling price.',
      filters: [from, to, store, { id: 'cat', label: 'Category', type: 'select', options: cats }],
      columns: ['Code', 'Item', 'Category', 'Dispensed', 'Counter sales', 'Total quantity', 'Value (KWD)'],
      rows: v => { const m = {};
        disp().filter(d => D(d.at, v) && (!v.wh || dispWh(d) === v.wh)).forEach(d => d.lines.forEach(l => { const x = m[l.itemId] = m[l.itemId] || [0, 0, 0]; x[0] += l.qty; x[2] += l.qty * l.price; }));
        if (!v.wh || v.wh === P.WH.OPD) db.pharmacySales.filter(s => s.status === 'Completed' && D(s.at, v)).forEach(s => s.lines.forEach(l => { const x = m[l.itemId] = m[l.itemId] || [0, 0, 0]; x[1] += l.qty; x[2] += l.qty * l.price; }));
        return Object.entries(m).filter(([id]) => !v.cat || it(id).category === v.cat).map(([id, x]) => [it(id).code, it(id).name, it(id).category, x[0], x[1], x[0] + x[1], +x[2].toFixed(3)]).sort((a, b) => b[6] - a[6]); },
      totals: r => ['Total', r.length + ' items', '', sum(r, 3), sum(r, 4), sum(r, 5), +sum(r, 6).toFixed(3)] },
    { id: 'PHR-04', title: 'Counter sales by payment method', purpose: 'Walk-in sales with payment method, reference and cashier.',
      filters: [from, to, { id: 'pm', label: 'Payment', type: 'select', options: [['Cash', 'Cash'], ['KNET', 'KNET'], ['Card', 'Card']] }, { id: 'by', label: 'Cashier', type: 'select', options: people(db.pharmacySales, s => s.by) }, { id: 'st', label: 'Status', type: 'select', options: [['Completed', 'Completed'], ['Voided', 'Voided']] }],
      columns: ['Date', 'Sale no', 'Customer', 'Items', 'Payment', 'Reference', 'Total (KWD)', 'Cashier', 'Status'],
      rows: v => db.pharmacySales.filter(s => D(s.at, v) && (!v.pm || s.payMode === v.pm) && (!v.by || s.by === v.by) && (!v.st || s.status === v.st)).sort((a, b) => b.at.localeCompare(a.at)).map(s => [Kit.day(s.at) + ' ' + Kit.time(s.at), s.no, s.customer || 'Walk-in', s.lines.length, s.payMode, s.payRef, +s.total.toFixed(3), s.by, s.status]),
      totals: r => ['Total', r.length + ' sales', '', sum(r, 3), '', '', +r.filter(x => x[8] === 'Completed').reduce((s, x) => s + x[6], 0).toFixed(3), '', 'Completed only'] },
    { id: 'PHR-05', title: 'Returns and refunds', purpose: 'Returned medicines, refund amounts, stock outcome and approver.',
      filters: [from, to, { id: 'src', label: 'Source', type: 'select', options: [['Dispense', 'Dispense'], ['Counter sale', 'Counter sale']] }, { id: 'st', label: 'Status', type: 'select', options: [['Pending approval', 'Pending approval'], ['Approved', 'Approved'], ['Rejected', 'Rejected']] }],
      columns: ['Requested', 'Return no', 'Source', 'Reference', 'Items', 'Back to stock', 'Refund (KWD)', 'Method', 'Requested by', 'Decided by', 'Status'],
      rows: v => db.pharmacyReturns.filter(r => D(r.requestedAt, v) && (!v.src || r.source === v.src) && (!v.st || r.status === v.st)).map(r => [Kit.day(r.requestedAt), r.no, r.source, r.refNo, Kit.sumBy(r.lines, l => l.qty), Kit.sumBy(r.lines.filter(l => l.toStock), l => l.qty), +Kit.sumBy(r.lines, l => l.qty * l.price).toFixed(3), r.refundMode, r.requestedBy, r.approvedBy || '', r.status]),
      totals: r => ['Total', r.length + ' returns', '', '', sum(r, 4), sum(r, 5), +sum(r, 6).toFixed(3), '', '', '', ''] },
    { id: 'PHR-06', title: 'Substitutions and pharmacist interventions', purpose: 'Substitutions, allergy and duplicate overrides, holds and cancelled lines.',
      filters: [from, to, { id: 'type', label: 'Type', type: 'select', options: ['Substitution', 'Allergy override', 'Duplicate override', 'Hold', 'Rejected'].map(x => [x, x]) }, { id: 'by', label: 'Pharmacist', type: 'select', options: people(db.pharmacyInterventions, x => x.by) }],
      columns: ['Date', 'Type', 'Reference', 'Patient', 'Detail', 'Pharmacist'],
      rows: v => db.pharmacyInterventions.filter(x => D(x.at, v) && (!v.type || x.type === v.type) && (!v.by || x.by === v.by)).map(x => [Kit.day(x.at) + ' ' + Kit.time(x.at), x.type, x.ref, Kit.ptName(x.patientId), x.detail, x.by]) },
    { id: 'PHR-07', title: 'Controlled drug movement summary', purpose: 'Opening, received, issued, wasted and closing balance per scheduled drug and store.',
      filters: [from, to, store, { id: 'drug', label: 'Drug', type: 'select', options: db.items.filter(i => i.schedule).map(i => [i.id, i.name]) }],
      columns: ['Drug', 'Schedule', 'Store', 'Opening', 'Received / returned', 'Issued', 'Wasted / adjusted', 'Closing', 'Not verified'],
      rows: v => { const out = []; db.items.filter(i => i.schedule && (!v.drug || i.id === v.drug)).forEach(i => [P.WH.IPD, P.WH.OPD].filter(w => !v.wh || w === v.wh).forEach(w => {
        const es = P.cdEntries(i.id, w); const before = es.filter(e => v.from && e.at < v.from); const inP = es.filter(e => D(e.at, v));
        const open = before.length ? before[before.length - 1].balance : 0;
        const rc = Kit.sumBy(inP.filter(e => e.sign > 0), e => e.qty), is = Kit.sumBy(inP.filter(e => e.type === 'Issue'), e => e.qty), wa = Kit.sumBy(inP.filter(e => /Wastage|Adjustment/.test(e.type)), e => e.qty);
        out.push([i.name, i.schedule, P.WH_NAME[w], open, rc, is, wa, open + rc - is - wa, inP.filter(e => !e.verifiedBy).length]); })); return out; } },
    { id: 'PHR-08', title: 'Near-expiry and expired stock', purpose: 'Batches expiring within the chosen window, and expired batches still in stock.',
      filters: [store, { id: 'win', label: 'Window', type: 'select', options: [['exp', 'Expired'], ['30', 'Within 30 days'], ['60', 'Within 60 days'], ['90', 'Within 90 days']], value: '90' }, { id: 'cat', label: 'Category', type: 'select', options: cats }],
      columns: ['Item', 'Code', 'Store', 'Batch', 'Expiry', 'Days left', 'Quantity', 'Value at cost (KWD)'],
      rows: v => db.stock.filter(s => [P.WH.OPD, P.WH.IPD].includes(s.warehouseId) && (!v.wh || s.warehouseId === v.wh) && Number(s.qty) > 0 && it(s.itemId).type === 'Drug' && (!v.cat || it(s.itemId).category === v.cat))
        .filter(s => { const d = P.daysTo(s.expiry); return v.win === 'exp' ? d <= 0 : v.win ? d > 0 && d <= Number(v.win) : d <= 90; }).sort((a, b) => a.expiry.localeCompare(b.expiry))
        .map(s => [it(s.itemId).name, it(s.itemId).code, P.WH_NAME[s.warehouseId], s.batch, Kit.day(s.expiry), P.daysTo(s.expiry), Number(s.qty), +(s.qty * (s.cost || it(s.itemId).cost)).toFixed(3)]),
      totals: r => ['Total', r.length + ' batches', '', '', '', '', sum(r, 6), +sum(r, 7).toFixed(3)] },
    { id: 'PHR-09', title: 'Below-minimum stock and suggested requests', purpose: 'Items under the minimum level per pharmacy store, with the quantity to request from the Main Store.',
      filters: [store, { id: 'cat', label: 'Category', type: 'select', options: cats }],
      columns: ['Code', 'Item', 'Category', 'Store', 'Usable stock', 'Minimum', 'Maximum', 'Suggested request', 'Main Store stock'],
      rows: v => { const out = []; db.items.filter(i => i.type === 'Drug' && (!v.cat || i.category === v.cat)).forEach(i => [P.WH.OPD, P.WH.IPD].filter(w => !v.wh || w === v.wh).forEach(w => { const q = P.available(i.id, w); if (q < i.min) out.push([i.code, i.name, i.category, P.WH_NAME[w], q, i.min, i.max, i.max - q, P.available(i.id, 'wh_01')]); })); return out; },
      totals: r => ['Total', r.length + ' lines', '', '', '', '', '', sum(r, 7), ''] },
    { id: 'PHR-10', title: 'Pharmacy revenue by payer', purpose: 'Gross pharmacy revenue split into patient share and payer share, including counter sales.',
      filters: [from, to, { id: 'set', label: 'Channel', type: 'select', options: [['OPD', 'OPD dispensing'], ['IPD', 'IPD supplies'], ['Counter', 'Counter sales']] }],
      columns: ['Payer', 'Channel', 'Transactions', 'Gross (KWD)', 'Patient share (KWD)', 'Payer share (KWD)'],
      rows: v => { const m = {};
        const add = (k, ch, g, pat, pay) => { const x = m[k + '|' + ch] = m[k + '|' + ch] || [k, ch, 0, 0, 0, 0]; x[2]++; x[3] += g; x[4] += pat; x[5] += pay; };
        disp().filter(d => D(d.at, v) && (!v.set || d.setting === v.set)).forEach(d => { const [pat, pay, py] = shareOf(d); add(py ? (Kit.payer(py) || {}).name : 'Cash (self-pay)', d.setting === 'IPD' ? 'IPD supplies' : 'OPD dispensing', d.total, pat, pay); });
        if (!v.set || v.set === 'Counter') db.pharmacySales.filter(s => s.status === 'Completed' && D(s.at, v)).forEach(s => add('Cash (self-pay)', 'Counter sales', s.total, s.total, 0));
        return Object.values(m).map(x => [x[0], x[1], x[2], +x[3].toFixed(3), +x[4].toFixed(3), +x[5].toFixed(3)]).sort((a, b) => b[3] - a[3]); },
      totals: r => ['Total', '', sum(r, 2), +sum(r, 3).toFixed(3), +sum(r, 4).toFixed(3), +sum(r, 5).toFixed(3)] },
  ] });
})();
</script>
</body>
</html>
