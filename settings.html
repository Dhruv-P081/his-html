<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Settings · Tibbi Orbit</title>
<link rel="stylesheet" href="assets/styles.css?v=4b09138480">
<script src="assets/icons.js?v=4b09138480"></script><script src="assets/data.js?v=4b09138480"></script><script src="assets/data-core.js?v=4b09138480"></script><script src="assets/data-settings.js?v=4b09138480"></script><script src="assets/i18n-ar.js?v=4b09138480"></script><script src="assets/i18n.js?v=4b09138480"></script><script src="assets/ui.js?v=4b09138480"></script><script src="assets/kit.js?v=4b09138480"></script>
</head>
<body>
<script>
const { db, save, $, $$, icon, esc, page, can, drawer, confirm, toast, audit, me, nowStamp, uid, badge, fmtDate, today, L } = UI;
const OPT = 'admin.system.settings';
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';   // after a save the page reloads at the top
const canEdit = can(OPT, 'edit');
const S = db.appSettings;
const clone = (o) => JSON.parse(JSON.stringify(o));
const who = () => (me() || {}).displayName || 'Unknown';
const CH = (id) => S.channels.find(c => c.id === id);
const MOBILE = ['android', 'ios'];

/* Semantic versions: 1.4.2 > 1.4.1 > 1.3.9 */
const SEMVER = /^\d+\.\d+\.\d+$/;
const cmpVer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };

/* WCAG contrast of white text on a colour. */
const lum = (h) => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const contrastWhite = (h) => 1.05 / (lum(h) + 0.05);

const STATUS_BADGE = { Live: 'b-ok', Scheduled: 'b-info', Replaced: 'b-neutral', 'Rolled back': 'b-err', Cancelled: 'b-neutral' };
const relBadge = (s) => `<span class="badge ${STATUS_BADGE[s] || 'b-neutral'}">${esc(s)}</span>`;

if (page({ active: 'settings.html', opt: OPT, title: 'App Settings',
  subtitle: 'App versions and update prompts, maintenance for the whole system or single apps, the portal look and language. Changes apply to every user.',
  crumbs: [['Home', 'home.html'], ['Administration', 'admin.html'], ['App Settings']],
  body: '<div id="tabs" style="margin-bottom:16px"></div><div id="pane"></div>' })) {

  const TABS = [{ id: 'apps', label: 'App control', icon: 'smartphone' }, { id: 'maint', label: 'Maintenance', icon: 'construction' }, { id: 'look', label: 'Appearance', icon: 'palette' }, { id: 'lang', label: 'Language', icon: 'languages' }];
  let relFilter = 'all';
  let tab = TABS.some(t => t.id === UI.param('tab')) ? UI.param('tab') : 'apps';
  const drawTab = () => { history.replaceState(null, '', 'settings.html?tab=' + tab); ({ apps: drawApps, look: drawLook, maint: drawMaint, lang: drawLang })[tab](); };
  const tabsCtl = Kit.tabs($('#tabs'), TABS, tab, (t) => { if (tab === 'look') UI.applyBrand(); tab = t; drawTab(); });

  /* =========================== Appearance =========================== */
  function drawLook() {
    const draft = clone(S.theme);
    if (!draft.primary) draft.primary = UI.THEMES.navy.primary;
    if (!draft.rail) draft.rail = UI.THEMES.navy.rail;
    const dirty = () => JSON.stringify(draft) !== JSON.stringify(Object.assign(clone(S.theme), { primary: S.theme.primary || UI.THEMES.navy.primary, rail: S.theme.rail || UI.THEMES.navy.rail }));
    const swatch = (id, t) => `<button type="button" class="swatch ${draft.preset === id ? 'on' : ''}" data-p="${id}" ${canEdit ? '' : 'disabled'}>
        <div class="sw-prev"><div class="sw-rail" style="background:${t.rail}"></div><div class="sw-body"><div class="sw-sel" style="background:${t.sel}"></div><div class="sw-line"></div><div class="sw-line" style="width:45%"></div><div class="sw-btn" style="background:${t.primary}"></div></div></div>
        <div class="sw-name"><span>${esc(t.name)}</span>${draft.preset === id ? icon('circle-check') : ''}</div></button>`;

    $('#pane').innerHTML = `
      ${canEdit ? '' : `<div class="banner info" style="margin-bottom:14px">${icon('lock')}<span>You can view these settings. Changing them needs edit rights on App Settings.</span></div>`}
      <div class="grid g-side" style="align-items:start">
        <div class="stack">
          <div class="card"><div class="card-head"><h3>${icon('palette')} Colour combination</h3><span class="small muted">Sidebar, buttons, links and selection</span></div><div class="card-pad">
            <div class="swatches">${Object.entries(UI.THEMES).map(([id, t]) => swatch(id, t)).join('')}${swatch('custom', Object.assign({ name: 'Custom colours' }, UI.themeColours({ preset: 'custom', primary: draft.primary, rail: draft.rail })))}</div>
            <div id="customBox" class="${draft.preset === 'custom' ? '' : 'hidden'}" style="margin-top:16px">
              <div class="form-grid c3">
                <div class="field"><label for="cPrim">Primary colour</label><div class="row" style="gap:8px"><input type="color" id="cPrim" value="${esc(draft.primary)}" style="width:44px;height:38px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card)"><input class="input mono" id="cPrimT" value="${esc(draft.primary)}" maxlength="7"></div></div>
                <div class="field"><label for="cRail">Sidebar colour</label><div class="row" style="gap:8px"><input type="color" id="cRail" value="${esc(draft.rail)}" style="width:44px;height:38px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card)"><input class="input mono" id="cRailT" value="${esc(draft.rail)}" maxlength="7"></div></div>
                <div class="field"><label>Readability</label><div id="contrast" style="padding-top:8px"></div></div>
              </div>
            </div>
          </div></div>

          <div class="card"><div class="card-head"><h3>${icon('square-round-corner')} Corners</h3></div><div class="card-pad">
            <div id="radius"></div><div class="hint" style="margin-top:8px">Rounding of cards, fields and buttons.</div>
          </div></div>

          <div class="card"><div class="card-head"><h3>${icon('image')} Logo and name</h3><span class="small muted">Sidebar, sign-in page, maintenance screen and printouts</span></div><div class="card-pad">
            <div class="row" style="gap:18px;align-items:flex-start;flex-wrap:wrap">
              <div class="logo-box" id="logoBox"><img src="${esc(draft.logo || UI.brandLogo())}" alt="Current logo"></div>
              <div class="stack tight" style="flex:1;min-width:220px">
                <div class="row" style="gap:8px;flex-wrap:wrap">
                  <label class="btn sm ${canEdit ? '' : 'disabled'}" style="cursor:pointer">${icon('upload')} Upload logo<input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden ${canEdit ? '' : 'disabled'}></label>
                  <button class="btn sm" id="logoReset" type="button" ${canEdit && draft.logo ? '' : 'disabled'}>${icon('rotate-ccw')} Use default logo</button>
                </div>
                <div class="hint">PNG, JPEG, SVG or WebP, up to 300 KB. A square image of at least 128 × 128 px looks best.</div>
                <div class="err-msg hidden" id="logoErr" style="color:var(--error);font-size:12px;font-weight:600"></div>
                <div class="field" style="margin-top:6px;max-width:360px"><label for="bName">Product name<span class="req">*</span></label><input class="input" id="bName" maxlength="40" value="${esc(draft.name || 'Tibbi Orbit')}" ${canEdit ? '' : 'disabled'}><span class="hint">Shown on the sign-in page and printouts.</span></div>
              </div>
            </div>
          </div></div>
        </div>

        <div class="card" style="position:sticky;top:76px"><div class="card-head"><h3>${icon('eye')} Live preview</h3></div><div class="card-pad stack">
          <div class="small muted">The portal around this page already shows your changes. Save to apply them for everybody, or discard.</div>
          <dl class="kv tight"><dt>Colours</dt><dd id="pvName"></dd><dt>Corners</dt><dd id="pvRad"></dd><dt>Last saved</dt><dd>${esc(S.theme.updatedBy || '-')}<div class="xs muted">${esc(S.theme.updatedAt ? fmtDate(S.theme.updatedAt) : '')}</div></dd></dl>
          <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary" type="button">${icon('check')} Primary</button><button class="btn" type="button">Secondary</button><label class="switch"><input type="checkbox" checked><span></span></label></div>
          <div class="banner info">${icon('moon')}<span>Dark mode keeps its own palette; the sidebar follows the brand colour.</span></div>
          ${canEdit ? `<div class="row" style="gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px"><button class="btn" id="discard" disabled>Discard</button><button class="btn primary" id="saveLook" disabled>${icon('save')} Save appearance</button></div>` : ''}
        </div></div>
      </div>`;

    const RAD = [['sharp', 'Sharp'], ['default', 'Standard'], ['rounded', 'Rounded']];
    const refresh = () => {
      UI.applyBrand(draft);
      $$('.shell .rail .logo img').forEach(i => { i.src = draft.logo || UI.brandLogo(); });
      $('#logoBox img').src = draft.logo || UI.R('assets/brand/app_icon.png');
      $('#logoReset').disabled = !canEdit || !draft.logo;
      $('#pvName').textContent = draft.preset === 'custom' ? 'Custom (' + draft.primary + ', ' + draft.rail + ')' : UI.THEMES[draft.preset].name;
      $('#pvRad').textContent = (RAD.find(r => r[0] === draft.radius) || RAD[1])[1];
      const c = UI.themeColours(draft).primary, k = contrastWhite(c);
      if ($('#contrast')) $('#contrast').innerHTML = k >= 4.5 ? `<span class="badge b-ok">${k.toFixed(1)} : 1 · Good</span>` : `<span class="badge b-err">${k.toFixed(1)} : 1 · Too light for white text</span>`;
      const nameOk = ($('#bName').value || '').trim().length >= 2;
      if ($('#saveLook')) { $('#saveLook').disabled = !dirty() || !nameOk || (draft.preset === 'custom' && k < 4.5); $('#discard').disabled = !dirty(); }
    };
    Kit.seg($('#radius'), RAD, draft.radius || 'default', (v) => { draft.radius = v; refresh(); });
    $$('.swatch').forEach(b => b.addEventListener('click', () => {
      draft.preset = b.dataset.p;
      $$('.swatch').forEach(x => { x.classList.toggle('on', x === b); const ic = x.querySelector('.sw-name .ico'); if (ic) ic.remove(); });
      b.querySelector('.sw-name').insertAdjacentHTML('beforeend', icon('circle-check'));
      $('#customBox').classList.toggle('hidden', draft.preset !== 'custom');
      refresh();
    }));
    const bindColour = (pick, text, key) => {
      if (!$(pick)) return;
      $(pick).addEventListener('input', () => { draft[key] = $(pick).value.toUpperCase(); $(text).value = draft[key]; updateCustomSwatch(); refresh(); });
      $(text).addEventListener('input', () => { const v = $(text).value.trim(); if (/^#[0-9a-f]{6}$/i.test(v)) { draft[key] = v.toUpperCase(); $(pick).value = v; updateCustomSwatch(); refresh(); } });
    };
    const updateCustomSwatch = () => { const t = UI.themeColours({ preset: 'custom', primary: draft.primary, rail: draft.rail }), sw = $('.swatch[data-p="custom"]'); sw.querySelector('.sw-rail').style.background = t.rail; sw.querySelector('.sw-btn').style.background = t.primary; sw.querySelector('.sw-sel').style.background = t.sel; };
    bindColour('#cPrim', '#cPrimT', 'primary'); bindColour('#cRail', '#cRailT', 'rail');
    $('#bName').addEventListener('input', () => { draft.name = $('#bName').value.trim(); refresh(); });
    $('#logoFile').addEventListener('change', (e) => {
      const f = e.target.files[0]; e.target.value = ''; const err = $('#logoErr'); err.classList.add('hidden');
      if (!f) return;
      if (!/^image\/(png|jpeg|svg\+xml|webp)$/.test(f.type)) { err.textContent = 'Choose a PNG, JPEG, SVG or WebP image.'; err.classList.remove('hidden'); return; }
      if (f.size > 300 * 1024) { err.textContent = 'The image is ' + Math.round(f.size / 1024) + ' KB. Use an image up to 300 KB.'; err.classList.remove('hidden'); return; }
      const rd = new FileReader(); rd.onload = () => { draft.logo = rd.result; refresh(); }; rd.readAsDataURL(f);
    });
    $('#logoReset').addEventListener('click', () => { delete draft.logo; refresh(); });
    if ($('#discard')) $('#discard').addEventListener('click', () => drawLook());
    if ($('#saveLook')) $('#saveLook').addEventListener('click', () => {
      const before = S.theme, after = Object.assign(clone(draft), { name: draft.name || 'Tibbi Orbit', updatedBy: who(), updatedAt: nowStamp() });
      if (after.preset !== 'custom') { after.primary = ''; after.rail = ''; }
      const changes = [];
      if (before.preset !== after.preset || before.primary !== after.primary || before.rail !== after.rail) changes.push(['Colours', before.preset === 'custom' ? 'Custom' : (UI.THEMES[before.preset] || {}).name, after.preset === 'custom' ? 'Custom ' + after.primary + ' / ' + after.rail : UI.THEMES[after.preset].name]);
      if ((before.radius || 'default') !== after.radius) changes.push(['Corners', before.radius || 'default', after.radius]);
      if ((before.logo || '') !== (after.logo || '')) changes.push(['Logo', before.logo ? 'Custom' : 'Default', after.logo ? 'Custom upload' : 'Default']);
      if ((before.name || 'Tibbi Orbit') !== after.name) changes.push(['Product name', before.name || 'Tibbi Orbit', after.name]);
      S.theme = after;
      try { save(); } catch (e) { S.theme = before; toast('The logo is too large to store in this browser. Use a smaller image.', 'err'); return; }
      audit('Appearance updated', 'App Settings', { id: 'appearance', label: 'Appearance' }, changes);
      toast('Appearance saved. Every user sees it on their next page load.');
      drawLook();
    });
    refresh();
  }

  /* =========================== Language =========================== */
  /* SOW V4: "maintain language defaults and translation overrides". English and Arabic;
   * Arabic turns the whole portal right-to-left. Overrides replace the standard Arabic
   * text for one English phrase (for example the hospital's own word for a ward). */
  function drawLang() {
    if (!S.language) S.language = clone(window.SEED.appSettings.language);
    const draft = clone(S.language);
    draft.overrides = draft.overrides || {};
    const DICT = (window.I18N && I18N.dict) || {};
    const total = Object.keys(DICT).length, done = Object.values(DICT).filter(Boolean).length;
    const dirty = () => JSON.stringify(draft) !== JSON.stringify(S.language);
    const cur = (window.I18N && I18N.lang) || 'en';

    $('#pane').innerHTML = `
      ${canEdit ? '' : `<div class="banner info" style="margin-bottom:14px">${icon('lock')}<span>You can view these settings. Changing them needs edit rights on App Settings.</span></div>`}
      <div class="grid g-side" style="align-items:start">
        <div class="stack">
          <div class="card"><div class="card-head"><h3>${icon('languages')} Languages</h3><span class="small muted">English and Arabic. Arabic shows every screen right-to-left.</span></div><div class="card-pad stack">
            <div class="field"><label>Default language</label><div id="defSeg"></div><span class="hint">Used the first time someone opens the portal in a browser. After that, each person's own choice is remembered.</span></div>
            <div class="row" style="justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:14px">
              <div><b>Let users switch language</b><div class="small muted">Shows the language button in the top bar and on the sign-in page.</div></div>
              <label class="switch"><input type="checkbox" id="arOn" ${draft.arabic ? 'checked' : ''} ${canEdit ? '' : 'disabled'}><span></span></label>
            </div>
          </div></div>

          <div class="card"><div class="card-head"><h3>${icon('type')} Translation overrides</h3><span class="small muted">Replace the standard Arabic text for a phrase</span></div>
            ${canEdit ? `<div class="card-pad" style="border-bottom:1px solid var(--line)">
              <div class="form-grid c3" style="align-items:end">
                <div class="field"><label for="ovEn">English text<span class="req">*</span></label><input class="input" id="ovEn" list="ovList" placeholder="For example: Ward" autocomplete="off"><datalist id="ovList"></datalist></div>
                <div class="field"><label for="ovAr">Arabic text<span class="req">*</span></label><input class="input" id="ovAr" dir="rtl" lang="ar" autocomplete="off"></div>
                <div class="field"><button class="btn" id="ovAdd" type="button" disabled>${icon('plus')} Add override</button></div>
              </div>
              <div class="hint" id="ovStd" translate="no" style="margin-top:6px"></div>
            </div>` : ''}
            <div id="ovTbl"></div>
          </div>
        </div>

        <div class="card" style="position:sticky;top:76px"><div class="card-head"><h3>${icon('globe')} Status</h3></div><div class="card-pad stack">
          <dl class="kv tight">
            <dt>Your language</dt><dd>${cur === 'ar' ? 'Arabic (right-to-left)' : 'English'}</dd>
            <dt>Translated phrases</dt><dd translate="no">${done.toLocaleString('en')} / ${total.toLocaleString('en')}</dd>
            <dt>Overrides</dt><dd id="ovCount" translate="no"></dd>
            <dt>Last saved</dt><dd>${esc(S.language.updatedBy || '-')}<div class="xs muted">${esc(S.language.updatedAt ? fmtDate(S.language.updatedAt) : '')}</div></dd>
          </dl>
          <div class="banner info">${icon('info')}<span>Names, notes and other data people type stay in the language they were entered in. Codes, MRNs and numbers keep Western digits.</span></div>
          ${S.language.arabic ? `<button class="btn" type="button" data-lang-switch="${cur === 'ar' ? 'en' : 'ar'}">${icon('languages')} <span>${cur === 'ar' ? 'Switch to English' : 'Switch to Arabic'}</span></button>` : ''}
          ${canEdit ? `<div class="row" style="gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px"><button class="btn" id="lDiscard" disabled>Discard</button><button class="btn primary" id="lSave" disabled>${icon('save')} Save language settings</button></div>` : ''}
        </div></div>
      </div>`;

    const drawOv = () => {
      const rows = Object.entries(draft.overrides);
      $('#ovCount').textContent = rows.length;
      $('#ovTbl').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>English</th><th>Standard Arabic</th><th>Override</th>${canEdit ? '<th></th>' : ''}</tr></thead><tbody>
        ${rows.map(([en, ar]) => `<tr><td translate="no">${esc(en)}</td><td translate="no" dir="rtl" class="muted">${esc(DICT[en] || '-')}</td><td translate="no" dir="rtl"><b>${esc(ar)}</b></td>${canEdit ? `<td class="actions"><button class="icon-btn" data-del="${esc(en)}" aria-label="Remove override" title="Remove">${icon('trash-2')}</button></td>` : ''}</tr>`).join('')}
        </tbody></table></div>` : `<div class="empty">No overrides. The standard Arabic text is used everywhere.</div>`;
      $$('[data-del]').forEach(b => b.addEventListener('click', () => { delete draft.overrides[b.dataset.del]; drawOv(); refresh(); }));
    };
    const refresh = () => { if ($('#lSave')) { $('#lSave').disabled = !dirty(); $('#lDiscard').disabled = !dirty(); } };
    Kit.seg($('#defSeg'), [['en', 'English'], ['ar', 'Arabic']], draft.default, (v) => { draft.default = v; refresh(); });
    if (!canEdit) $$('#defSeg button').forEach(b => { b.disabled = true; });
    $('#arOn').addEventListener('change', (e) => { draft.arabic = e.target.checked; refresh(); });
    if (canEdit) {
      const en = $('#ovEn'), ar = $('#ovAr'), add = $('#ovAdd');
      const check = () => {
        const k = en.value.trim(), std = DICT[k];
        $('#ovStd').textContent = k ? (std ? (cur === 'ar' ? 'الترجمة القياسية: ' : 'Standard Arabic: ') + std : (cur === 'ar' ? 'غير موجودة في القاموس القياسي. سيضيفها هذا التجاوز.' : 'Not in the standard dictionary yet. The override adds it.')) : '';
        add.disabled = !(k.length >= 2 && /[؀-ۿ]/.test(ar.value));
      };
      en.addEventListener('input', () => {
        const q = en.value.trim().toLowerCase();
        $('#ovList').innerHTML = q.length < 2 ? '' : Object.keys(DICT).filter(k => DICT[k] && k.toLowerCase().includes(q)).slice(0, 12).map(k => `<option value="${esc(k)}"></option>`).join('');
        check();
      });
      ar.addEventListener('input', check);
      add.addEventListener('click', () => { draft.overrides[en.value.trim()] = ar.value.trim(); en.value = ''; ar.value = ''; check(); drawOv(); refresh(); });
      $('#lDiscard').addEventListener('click', () => drawLang());
      $('#lSave').addEventListener('click', () => {
        const before = S.language, changes = [];
        if (before.default !== draft.default) changes.push(['Default language', before.default === 'ar' ? 'Arabic' : 'English', draft.default === 'ar' ? 'Arabic' : 'English']);
        if (!!before.arabic !== !!draft.arabic) changes.push(['Language switch', before.arabic ? 'On' : 'Off', draft.arabic ? 'On' : 'Off']);
        const bo = before.overrides || {}, ao = draft.overrides;
        new Set([...Object.keys(bo), ...Object.keys(ao)]).forEach(k => { if (bo[k] !== ao[k]) changes.push(['Override: ' + k, bo[k] || '-', ao[k] || 'Removed']); });
        S.language = Object.assign(clone(draft), { updatedBy: who(), updatedAt: nowStamp() });
        save();
        audit('Language settings updated', 'App Settings', { id: 'language', label: 'Language' }, changes);
        toast('Language settings saved.');
        setTimeout(() => location.reload(), 400);
      });
    }
    drawOv(); refresh();
  }

  /* =========================== App control =========================== */
  const PLAT_NAME = { android: 'Android', ios: 'iOS', web: 'Web portal', api: 'Backend API' };
  const STORE_RE = { android: /^https:\/\/play\.google\.com\/\S+$/, ios: /^https:\/\/apps\.apple\.com\/\S+$/, web: /^https:\/\/\S+$/ };
  const VER_RE = /^\d+\.\d+\.\d+\+\d+$/;
  const pill = (on) => `<span class="badge ${on ? 'b-ok' : 'b-err'} nodot tg-pill">${on ? 'ON' : 'OFF'}</span>`;
  const tog = (key, on, dis) => `<label class="tg"><span class="switch"><input type="checkbox" data-k="${key}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><span></span></span>${pill(on)}</label>`;
  const syncPill = (inp) => { const p = inp.closest('.tg').querySelector('.tg-pill'); p.className = 'badge ' + (inp.checked ? 'b-ok' : 'b-err') + ' nodot tg-pill'; p.textContent = inp.checked ? 'ON' : 'OFF'; };
  /* Status badges for a channel: maintenance comes only from the Maintenance tab. */
  function chanBadges(c, d) {
    d = d || { live: c.live !== false, force: !!c.force, upd: !!c.updateAvailable };
    const b = [], ms = UI.maintState(c.id);
    if (ms.status === 'active') b.push('<span class="badge b-err">Maintenance</span>');
    else if (ms.status === 'scheduled') b.push('<span class="badge b-info">Maintenance planned</span>');
    if (MOBILE.includes(c.id)) {
      if (!d.live) b.push('<span class="badge b-neutral">Not live</span>');
      if (d.force) b.push('<span class="badge b-warn">Force update</span>'); else if (d.upd) b.push('<span class="badge b-info">Update available</span>');
    }
    if (!b.length) b.push('<span class="badge b-ok">Running</span>');
    return b.join(' ');
  }

  function drawApps() {
    const ms = UI.maintState('web').m || S.maintenance, gst = maintGlobal();
    const P = S.push, pct = (n) => Math.round(100 * n / Math.max(1, P.sent));
    const mob = S.channels.filter(c => MOBILE.includes(c.id)), web = CH('web'), api = CH('api');
    const appLive = mob.some(c => c.live !== false);
    const head = (cols) => `<thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>`;
    const where = (S.maintenance.scope || []).map(s => PLAT_NAME[s]).join(', ');

    $('#pane').innerHTML = `
      ${canEdit ? '' : `<div class="banner info" style="margin-bottom:14px">${icon('lock')}<span>You can view app control. Changing it needs edit rights on App Settings.</span></div>`}
      <div class="row" style="margin-bottom:14px;gap:10px;flex-wrap:wrap"><div class="grow small muted">Mark which apps are live and ask people to update. Release history is at the bottom. Changes apply the next time someone opens the app.</div><button class="btn sm" id="appsRefresh">${icon('refresh-cw')} Refresh</button></div>

      <div class="card sys-card ${gst === 'active' ? 'on' : ''}" style="margin-bottom:14px"><div class="card-pad row" style="gap:14px;align-items:center;flex-wrap:wrap">
        <span class="tile ${gst === 'active' ? 't-rose' : gst === 'scheduled' ? 't-sky' : 't-mint'}" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center">${icon(gst === 'active' ? 'construction' : gst === 'scheduled' ? 'calendar-clock' : 'circle-check')}</span>
        <div class="grow" style="min-width:240px"><div class="row" style="gap:8px"><b>Maintenance</b>${gst === 'active' ? '<span class="badge b-err">Active</span>' : gst === 'scheduled' ? '<span class="badge b-info">Scheduled</span>' : '<span class="badge b-ok">Off · everything running</span>'}</div>
          <div class="small muted">${gst === 'active' ? `${esc(where)} ${S.maintenance.to ? 'until ' + esc(UI.fmtLocal(S.maintenance.to)) : 'until it is ended'}.` : gst === 'scheduled' ? `${esc(where)} from ${esc(UI.fmtLocal(S.maintenance.from))}${S.maintenance.to ? ' to ' + esc(UI.fmtLocal(S.maintenance.to)) : ''}.` : 'Start, schedule or end maintenance for the whole system or for single apps on the Maintenance tab.'}</div></div>
        <button class="btn ${gst === 'off' ? '' : 'primary'}" id="goMaint">${icon('construction')} ${gst === 'off' ? 'Open maintenance' : 'Manage maintenance'}</button>
      </div></div>

      <div class="banner info push-box" style="margin-bottom:14px">${icon('bell-ring')}<span><b>Push notifications:</b> working. ${Kit.num(P.phones)} phones registered for ${Kit.num(P.people)} people. Last 7 days: ${Kit.num(P.sent)} sent to phones — ${Kit.num(P.delivered)} delivered (${pct(P.delivered)}%), ${Kit.num(P.failed)} failed, ${Kit.num(P.notSent)} not sent.
        <b style="display:block;margin-top:8px">Why some were not sent</b><ul style="margin:4px 0 0;padding-inline-start:18px">${P.reasons.map(r => `<li>${Kit.num(r[0])} × ${esc(r[1])}</li>`).join('')}</ul></span></div>

      <div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>${icon('smartphone')} Patient App</h3><div class="small muted" style="margin-top:2px">What patients use to book appointments, see results and pay.</div></div><div class="actions">${tog('app', appLive, !canEdit)}</div></div>
        <div class="table-wrap"><table class="tbl app-tbl">${head(['Platform', 'Live', 'Latest version and store link', 'Update<br>available', 'Force<br>update', 'Status', ''])}<tbody>
        ${mob.map(c => `<tr data-row="${c.id}">
          <td><b>${PLAT_NAME[c.id]}</b><div class="xs muted">${esc(c.env)}</div></td>
          <td>${tog('live', c.live !== false, !canEdit)}</td>
          <td><div class="stack tight" style="width:250px"><input class="input sm mono" data-f="ver" value="${esc(c.current + '+' + c.build)}" aria-label="Latest version" style="width:130px" ${canEdit ? '' : 'disabled'}><div class="xs err-t hidden" data-e="ver"></div>
            <input class="input sm" data-f="store" value="${esc(c.store || '')}" aria-label="Store link" ${canEdit ? '' : 'disabled'}><div class="xs err-t hidden" data-e="store"></div></div></td>
          <td>${tog('upd', !!(c.updateAvailable || c.force), !canEdit || c.force)}</td>
          <td>${tog('force', !!c.force, !canEdit)}</td>
          <td><div class="row" style="gap:6px;flex-wrap:wrap;max-width:200px" data-status>${chanBadges(c)}</div><div class="xs muted" style="margin-top:6px">Released ${esc(fmtDate(c.releasedAt))}</div></td>
          <td class="actions"><div class="row-acts"><button class="icon-btn" data-prev title="Preview what users see" aria-label="Preview">${icon('eye')}</button>${canEdit ? `<button class="btn sm primary" data-save disabled>Save</button>` : ''}</div></td>
        </tr>`).join('')}
        </tbody></table></div></div>

      <div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>${icon('monitor')} Staff web portal and API</h3><div class="small muted" style="margin-top:2px">What hospital staff use, and the service behind both apps.</div></div></div>
        <div class="table-wrap"><table class="tbl app-tbl">${head(['Platform', 'Live version', 'Address', 'Status', ''])}<tbody>
        ${[web, api].map(c => `<tr data-row="${c.id}">
          <td style="white-space:nowrap"><b>${PLAT_NAME[c.id]}</b><div class="xs muted">${esc(c.env)}</div></td>
          <td><b class="mono">v${esc(c.current)}</b><div class="xs muted mono">build ${esc(c.build)}</div></td>
          <td>${c.id === 'web' ? `<input class="input sm" data-f="store" value="${esc(c.store || '')}" aria-label="Portal address" style="width:260px" ${canEdit ? '' : 'disabled'}><div class="xs err-t hidden" data-e="store"></div>` : `<span class="mono small">${esc(c.store || '')}</span>`}</td>
          <td><div class="row" style="gap:6px;flex-wrap:wrap">${chanBadges(c)}</div><div class="xs muted" style="margin-top:6px">Released ${esc(fmtDate(c.releasedAt))}</div></td>
          <td class="actions"><div class="row-acts">${c.id === 'web' && canEdit ? `<button class="btn sm primary" data-save disabled>Save</button>` : ''}</div></td>
        </tr>`).join('')}
        </tbody></table></div></div>

      <div id="relHost"></div>`;

    $('#appsRefresh').addEventListener('click', () => { drawApps(); toast('App status refreshed.'); });
    $('#goMaint').addEventListener('click', () => tabsCtl.set('maint'));

    /* Patient App live switch (both stores) */
    const appT = $('[data-k="app"]');
    appT.addEventListener('change', () => {
      const on = appT.checked; appT.checked = !on; syncPill(appT);
      confirm({ title: on ? 'Mark the Patient App live on both stores?' : 'Mark the Patient App as not live?', body: on ? 'Android and iOS are marked live. The app works for everybody who installs it.' : 'Android and iOS are marked not live. People who open the app see a “coming soon” screen.', tone: on ? 'primary' : 'danger', icon: on ? 'rocket' : 'power', confirm: on ? 'Mark live' : 'Mark not live', reason: !on,
        onConfirm: (why) => { mob.forEach(c => { c.live = on; }); save(); audit(on ? 'Patient App marked live' : 'Patient App marked not live', 'App Settings', { id: 'patient-app', label: 'Patient App' }, [['Live', on ? 'Off' : 'On', on ? 'On' : 'Off']], why ? { reason: why } : {}); toast(on ? 'Patient App is live on Android and iOS.' : 'Patient App is marked not live.'); drawApps(); } });
    });

    /* Rows: live, version, store link, update prompts */
    $$('tr[data-row]').forEach(tr => {
      const c = CH(tr.dataset.row), isMob = MOBILE.includes(c.id);
      if (!tr.querySelector('[data-save]') && !tr.querySelector('[data-prev]')) return;
      const d = { live: c.live !== false, ver: c.current + '+' + c.build, store: c.store || '', upd: !!(c.updateAvailable || c.force), force: !!c.force };
      const base = JSON.stringify(d);
      const q = (s) => tr.querySelector(s);
      const read = () => {
        if (isMob) { d.live = q('[data-k="live"]').checked; d.ver = q('[data-f="ver"]').value.trim(); d.upd = q('[data-k="upd"]').checked; d.force = q('[data-k="force"]').checked; }
        if (q('[data-f="store"]')) d.store = q('[data-f="store"]').value.trim();
      };
      const errs = () => {
        const e = {};
        if (isMob) {
          if (!VER_RE.test(d.ver)) e.ver = 'Use 1.3.0+130';
          else { const [v, bld] = d.ver.split('+'); const k = cmpVer(v, c.current); if (k < 0) e.ver = 'Lower than live v' + c.current + '.'; else if (k === 0 && +bld < +c.build) e.ver = 'Build lower than ' + c.build; }
        }
        if (STORE_RE[c.id] && !STORE_RE[c.id].test(d.store)) e.store = c.id === 'android' ? 'Use a play.google.com link' : c.id === 'ios' ? 'Use an apps.apple.com link' : 'Use an https:// address';
        return e;
      };
      const chk = () => {
        read();
        if (isMob) { const u = q('[data-k="upd"]'); if (d.force) { u.checked = true; d.upd = true; } u.disabled = !canEdit || d.force; syncPill(u); q('[data-status]').innerHTML = chanBadges(c, d); }
        const e = errs();
        ['ver', 'store'].forEach(k => { const el = q(`[data-e="${k}"]`); if (!el) return; el.textContent = e[k] || ''; el.classList.toggle('hidden', !e[k]); });
        tr.classList.toggle('dirty', JSON.stringify(d) !== base);
        const sv = q('[data-save]'); if (sv) sv.disabled = JSON.stringify(d) === base || Object.keys(e).length > 0;
      };
      $$('input', tr).forEach(i => { i.addEventListener('input', chk); i.addEventListener('change', () => { if (i.dataset.k) syncPill(i); chk(); }); });
      if (q('[data-prev]')) q('[data-prev]').addEventListener('click', () => { read(); preview(c, d); });
      const sv = q('[data-save]');
      if (sv) sv.addEventListener('click', () => {
        read();
        const old = JSON.parse(base), ch = [];
        const lab = { live: 'Live', ver: 'Latest version', store: c.id === 'web' ? 'Address' : 'Store link', upd: 'Update available', force: 'Force update' };
        Object.keys(lab).forEach(k => { if (old[k] !== d[k]) ch.push([lab[k], typeof old[k] === 'boolean' ? (old[k] ? 'On' : 'Off') : old[k], typeof d[k] === 'boolean' ? (d[k] ? 'On' : 'Off') : d[k]]); });
        const commit = (why) => {
          if (isMob) {
            const [v, bld] = d.ver.split('+');
            if (cmpVer(v, c.current) > 0) {
              S.releases.filter(x => x.channel === c.id && x.status === 'Live').forEach(x => { x.status = 'Replaced'; });
              S.releases.unshift({ id: uid('rl'), channel: c.id, version: v, build: bld, date: today(), status: 'Live', notes: 'Store version updated from App control.', by: who() });
              c.releasedAt = today();
            }
            c.current = v; c.build = bld; c.live = d.live; c.updateAvailable = d.upd; c.force = d.force;
            if (d.force) c.min = v;
          }
          c.store = d.store; save();
          audit('App control updated', 'App Settings', { id: c.id, label: c.name }, ch, why ? { reason: why } : {});
          toast(c.name + ' saved. ' + (d.force ? 'Force update is on.' : 'Users get it next time they open ' + (isMob ? 'the app.' : 'the portal.')));
          drawApps();
        };
        const risky = (d.force && !old.force) || (isMob && !d.live && old.live);
        if (!risky) return commit();
        confirm({ title: 'Save ' + c.name + '?', body: 'Check the impact before you save.', reason: true, confirm: 'Save',
          impact: [d.force && !old.force ? 'People on a version older than v' + esc(d.ver.split('+')[0]) + ' must update from the store before they continue.' : '', isMob && !d.live && old.live ? 'The app shows a “coming soon” screen on ' + PLAT_NAME[c.id] + '.' : ''].filter(Boolean),
          onConfirm: commit });
      });
      chk();
    });

    drawReleases($('#relHost'));
  }

  /* Phone preview of what a patient sees for the row's unsaved settings. */
  function preview(c, d) {
    const [v] = (d.ver || c.current).split('+'), col = UI.themeColours(S.theme).primary, ms = UI.maintState(c.id);
    const st = ms.status === 'active' ? 'maint' : !d.live ? 'soon' : d.force ? 'force' : d.upd ? 'upd' : 'ok';
    const body = {
      maint: [icon('construction'), 'Under maintenance', esc(ms.m.msgEn), '', ''],
      soon: [icon('rocket'), 'Coming soon', 'The ' + esc(UI.brandName()) + ' app is not available yet.', '', ''],
      force: [icon('download'), 'Update required', 'A new version (v' + esc(v) + ') is required to continue.', 'Update now', ''],
      upd: [icon('download'), 'Update available', 'Version v' + esc(v) + ' is ready with improvements.', 'Update now', 'Later'],
      ok: [icon('circle-check'), 'App opens normally', 'No prompt is shown.', '', ''],
    }[st];
    drawer({ title: 'What users see · ' + PLAT_NAME[c.id], sub: 'Preview of your unsaved settings.', narrow: true,
      body: `<div class="phone-prev">${body[0]}<div style="font-weight:800;margin:8px 0 4px">${body[1]}</div><div style="font-size:12px;color:#526075">${body[2]}</div>${st === 'maint' && ms.m.msgAr ? `<div dir="rtl" lang="ar" style="font-size:12px;color:#526075;margin-top:6px">${esc(ms.m.msgAr)}</div>` : ''}${body[3] ? `<div style="margin-top:12px;background:${col};color:#fff;border-radius:10px;padding:8px;font-size:12px;font-weight:700">${body[3]}</div>` : ''}${body[4] ? `<div style="margin-top:8px;font-size:12px;color:#526075">${body[4]}</div>` : ''}</div>
        <div class="hint" style="text-align:center;margin-top:12px">${st === 'upd' ? 'People can skip this and keep using the app.' : st === 'force' ? 'People cannot continue until they update.' : st === 'maint' ? 'Maintenance is set on the Maintenance tab.' : ''}</div>` });
  }

  /* ---------- Release history (read-only, part of App control) ----------
   * Web portal and API entries come from the deployment pipeline; a Patient App entry is added
   * when the latest version is raised on App control. Nothing is released or rolled back here. */
  function drawReleases(host) {
    const n = S.releases.length;
    host.innerHTML = `<details class="card rel-card"><summary class="card-head"><div><h3>${icon('history')} Release history <span class="tag">${n}</span></h3><div class="small muted" style="margin-top:2px">For reference only. Click to show or hide.</div></div><span class="rel-chev">${icon('chevron-down')}</span></summary>
      <div class="card-pad" style="padding-bottom:0"><div class="banner info" style="margin-bottom:12px">${icon('info')}<span>Web portal and Backend API entries are added automatically by each deployment. A Patient App entry is added when you raise the latest version above. To undo a bad app release, turn Force update off and set the latest version back; store builds cannot be withdrawn from here.</span></div>
        <div id="relSeg"></div></div>
      <div class="table-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Version</th><th>Channel</th><th>Release date</th><th>Status</th><th>Notes</th><th>Source</th></tr></thead><tbody id="relBody"></tbody></table></div></details>`;
    Kit.seg($('#relSeg'), [['all', 'All'], ['web', 'Web'], ['android', 'Android'], ['ios', 'iOS'], ['api', 'API']], relFilter, (v) => { relFilter = v; body(); });
    const src = (r) => MOBILE.includes(r.channel) ? esc(r.by) : 'Deployment pipeline';
    const body = () => {
      const rows = S.releases.filter(r => relFilter === 'all' || r.channel === relFilter).sort((a, b) => b.date.localeCompare(a.date) || cmpVer(b.version, a.version));
      $('#relBody').innerHTML = rows.length ? rows.map(r => `<tr><td><b class="mono">v${esc(r.version)}</b></td><td>${esc(CH(r.channel).name)}</td><td>${esc(fmtDate(r.date))}</td><td>${relBadge(r.status)}</td><td style="max-width:380px">${esc(r.notes)}</td><td>${src(r)}</td></tr>`).join('')
        : `<tr><td colspan="6"><div class="empty">${icon('git-branch')}<b>No releases for this channel</b></div></td></tr>`;
    };
    body();
  }

  /* =========================== Maintenance (single place) =========================== */
  const SC = [['web', 'Staff web portal', 'monitor'], ['android', 'Patient app · Android', 'smartphone'], ['ios', 'Patient app · iOS', 'tablet-smartphone']];
  const pad2 = (n) => String(n).padStart(2, '0');
  const locNow = (ms) => { const d = new Date(Date.now() + (ms || 0)); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  /* off | scheduled | active | ended for the single maintenance setting */
  function maintGlobal() { const m = S.maintenance; if (!m.on) return 'off'; const n = locNow(); if (m.from && n < m.from) return 'scheduled'; if (m.to && n > m.to) return 'ended'; return 'active'; }

  function drawMaint() {
    const m = S.maintenance, st = maintGlobal() === 'ended' ? 'off' : maintGlobal();
    const roles = db.roles.filter(r => r.status === 'Active');
    let when = st === 'scheduled' ? 'later' : 'now', scopeMode = (m.scope || []).length === 3 ? 'all' : 'some';
    const where = (m.scope || []).map(s => SC.find(x => x[0] === s)[1]).join(', ');
    $('#pane').innerHTML = `
      ${canEdit ? '' : `<div class="banner info" style="margin-bottom:14px">${icon('lock')}<span>You can view maintenance. Changing it needs edit rights on App Settings.</span></div>`}
      <div class="grid g-side" style="align-items:start">
        <div class="stack">
          <div class="card sys-card ${st === 'active' ? 'on' : ''}"><div class="card-pad row" style="gap:16px;align-items:center;flex-wrap:wrap">
            <span class="tile ${st === 'active' ? 't-rose' : st === 'scheduled' ? 't-sky' : 't-mint'}" style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center">${icon(st === 'active' ? 'construction' : st === 'scheduled' ? 'calendar-clock' : 'circle-check')}</span>
            <div class="grow" style="min-width:240px"><div class="row" style="gap:8px"><b>Maintenance</b>${st === 'active' ? '<span class="badge b-err">Active now</span>' : st === 'scheduled' ? '<span class="badge b-info">Scheduled</span>' : '<span class="badge b-ok">Off</span>'}</div>
              <div class="small muted">${st === 'active' ? `${esc(where)} ${m.to ? 'until ' + esc(UI.fmtLocal(m.to)) : 'until you end it'}.` : st === 'scheduled' ? `${esc(where)} from ${esc(UI.fmtLocal(m.from))}${m.to ? ' to ' + esc(UI.fmtLocal(m.to)) : ''}.` : 'Everything is running. Set up maintenance below.'}
                ${m.updatedBy ? `<br>Last changed by ${esc(m.updatedBy)}${m.updatedAt ? ', ' + esc(fmtDate(m.updatedAt)) : ''}.` : ''}</div></div>
            ${canEdit && st === 'active' ? `<button class="btn primary" id="mEnd">${icon('power')} End maintenance</button>` : ''}
            ${canEdit && st === 'scheduled' ? `<button class="btn" id="mCancel">Cancel schedule</button>` : ''}
          </div></div>

          <div class="card"><div class="card-head"><h3>${icon('settings-2')} ${st === 'off' ? 'Set up maintenance' : 'Maintenance details'}</h3></div><div class="card-pad">
            <div class="form-grid">
              <div class="field full"><label>What goes into maintenance<span class="req">*</span></label><div id="mScopeSeg"></div>
                <div class="row" id="mScopeBox" style="gap:16px;flex-wrap:wrap;margin-top:10px">${SC.map(([id, n]) => `<label class="check"><input type="checkbox" data-sc="${id}" ${(m.scope || []).includes(id) ? 'checked' : ''} ${canEdit ? '' : 'disabled'}> ${esc(n)}</label>`).join('')}</div></div>
              <div class="field full"><label>When<span class="req">*</span></label><div id="mWhenSeg"></div></div>
              <div class="field" id="mFromBox"><label for="mFrom">Starts<span class="req">*</span></label><input class="input" type="datetime-local" id="mFrom" value="${esc(m.from || '')}" min="${locNow()}" ${canEdit ? '' : 'disabled'}></div>
              <div class="field"><label for="mTo">Expected end</label><input class="input" type="datetime-local" id="mTo" value="${esc(m.to || '')}" ${canEdit ? '' : 'disabled'}><span class="hint">Leave empty to keep it on until you end it.</span><span class="err-msg hidden" id="mToErr" style="color:var(--error);font-size:12px;font-weight:600"></span></div>
              <div class="field full"><label for="mEn">Message (English)<span class="req">*</span></label><textarea class="input" id="mEn" rows="2" maxlength="240" ${canEdit ? '' : 'disabled'}>${esc(m.msgEn)}</textarea></div>
              <div class="field full"><label for="mAr">Message (Arabic)</label><textarea class="input" id="mAr" rows="2" maxlength="240" dir="rtl" lang="ar" ${canEdit ? '' : 'disabled'}>${esc(m.msgAr)}</textarea><span class="hint">Shown to users whose app or browser is in Arabic. Leave empty to show the English text.</span></div>
              <div class="field full"><label>Roles that keep working on the web portal</label><div class="row" style="gap:8px 16px;flex-wrap:wrap">${roles.map(r => `<label class="check"><input type="checkbox" data-ex="${r.id}" ${(m.exemptRoles || []).includes(r.id) ? 'checked' : ''} ${canEdit ? '' : 'disabled'}> ${esc(r.name)}</label>`).join('')}</div><span class="hint">Everybody else sees the maintenance screen. Keep at least one administrator role so you can end maintenance.</span></div>
            </div>
            ${canEdit ? `<div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap"><span class="grow small muted" id="mLeft"></span>
              ${st === 'off' ? `<button class="btn primary" id="mGo" disabled></button>` : `<button class="btn" id="mReset" disabled>Discard</button><button class="btn primary" id="mSave" disabled>${icon('save')} Save changes</button>${st === 'scheduled' ? `<button class="btn" id="mNowBtn">${icon('zap')} Start now</button>` : ''}`}</div>` : ''}
          </div></div>
        </div>

        <div class="card" style="position:sticky;top:76px"><div class="card-head"><h3>${icon('eye')} What users see</h3></div><div class="card-pad stack"><div id="pvSeg"></div><div class="stack" id="pvBox"></div></div></div>
      </div>`;

    const read = () => ({ scope: $$('[data-sc]').filter(i => i.checked).map(i => i.dataset.sc), from: when === 'later' ? $('#mFrom').value : (st === 'active' ? m.from : ''), to: $('#mTo').value, msgEn: $('#mEn').value.trim(), msgAr: $('#mAr').value.trim(), exemptRoles: $$('[data-ex]').filter(i => i.checked).map(i => i.dataset.ex) });
    const keyOf = (x) => JSON.stringify([x.scope, x.from || '', x.to || '', x.msgEn, x.msgAr, x.exemptRoles]);
    let pv = 'web';
    const drawPreview = () => {
      const v = read();
      const on = v.scope.includes(pv);
      $('#pvBox').innerHTML = !on ? `<div class="empty" style="padding:24px 10px">${icon('circle-check')}<b>Not affected</b><span>${esc(SC.find(x => x[0] === pv)[1])} keeps working.</span></div>`
        : pv === 'web' ? `<div class="maint-card" style="box-shadow:none;padding:20px 16px"><img src="${esc(UI.brandLogo())}" alt="" class="maint-logo" style="width:40px;height:40px;margin-bottom:10px"><div class="m-ico b-warn" style="width:40px;height:40px">${icon('construction')}</div><h1 style="font-size:18px">Under maintenance</h1><p class="small">${esc(v.msgEn || '—')}</p>${v.msgAr ? `<p class="small maint-ar" dir="rtl" lang="ar">${esc(v.msgAr)}</p>` : ''}<div class="maint-when" style="margin:6px 0 0">${icon('clock')}<span>Back: <b>${esc(UI.fmtLocal(v.to))}</b></span></div></div><div class="xs muted" style="text-align:center">Staff without an exempt role.</div>`
        : `<div class="phone-prev">${icon('construction')}<div style="font-weight:800;margin:8px 0 4px">Under maintenance</div><div style="font-size:12px;color:#526075">${esc(v.msgEn || '—')}</div>${v.msgAr ? `<div dir="rtl" lang="ar" style="font-size:12px;color:#526075;margin-top:6px">${esc(v.msgAr)}</div>` : ''}<div style="font-size:11px;color:#8794A7;margin-top:10px">Back: ${esc(UI.fmtLocal(v.to))}</div></div><div class="xs muted" style="text-align:center">Patients who open the app.</div>`;
    };
    Kit.seg($('#pvSeg'), [['web', 'Web'], ['android', 'Android'], ['ios', 'iOS']], pv, (x) => { pv = x; drawPreview(); });
    const setScopeMode = () => { $$('[data-sc]').forEach(i => { if (scopeMode === 'all') i.checked = true; i.disabled = !canEdit || scopeMode === 'all'; }); };
    Kit.seg($('#mScopeSeg'), [['all', 'Whole system', 'globe'], ['some', 'Choose apps', 'list-checks']], scopeMode, (x) => { scopeMode = x; setScopeMode(); chk(); });
    const whenOpts = st === 'active' ? [['now', 'Running now', 'zap']] : [['now', 'Start now', 'zap'], ['later', 'Schedule', 'calendar-clock']];
    Kit.seg($('#mWhenSeg'), whenOpts, when, (x) => { when = x; chk(); });
    setScopeMode();

    const chk = () => {
      const v = read();
      $('#mFromBox').classList.toggle('hidden', when !== 'later');
      let toErr = '';
      if (v.to && v.to <= locNow()) toErr = 'The end must be in the future.';
      else if (when === 'later' && v.from && v.to && v.to <= v.from) toErr = 'The end must be after the start.';
      $('#mToErr').textContent = toErr; $('#mToErr').classList.toggle('hidden', !toErr);
      drawPreview();
      if (!canEdit) return;
      const missing = [!v.scope.length && 'what goes into maintenance', when === 'later' && !v.from && 'start time', when === 'later' && v.from && v.from <= locNow() && 'a start time in the future', !v.msgEn && 'English message', !v.exemptRoles.length && 'an exempt role'].filter(Boolean);
      $('#mLeft').textContent = missing.length ? 'Still needed: ' + missing.join(', ') + '.' : '';
      const ok = !missing.length && !toErr;
      if ($('#mGo')) { $('#mGo').disabled = !ok; $('#mGo').innerHTML = when === 'later' ? `${icon('calendar-clock')} Schedule maintenance` : `${icon('construction')} Start maintenance now`; $('#mGo').className = 'btn ' + (when === 'later' ? 'primary' : 'destructive'); }
      if ($('#mSave')) { const dirty = keyOf(v) !== keyOf(m); $('#mSave').disabled = !dirty || !ok; $('#mReset').disabled = !dirty; }
    };
    $$('#pane input, #pane textarea').forEach(i => { i.addEventListener('input', chk); i.addEventListener('change', chk); });
    chk();

    const names = (v) => v.scope.map(s => SC.find(x => x[0] === s)[1]).join(', ');
    const commit = (v, action, why) => {
      const before = clone(m);
      Object.assign(m, v, { updatedBy: who(), updatedAt: nowStamp() }); save();
      const ch = [['Status', before.on ? 'On' : 'Off', m.on ? 'On' : 'Off'], ['Applies to', (before.scope || []).join(', '), (m.scope || []).join(', ')], ['Window', UI.fmtLocal(before.from) + ' – ' + UI.fmtLocal(before.to), UI.fmtLocal(m.from) + ' – ' + UI.fmtLocal(m.to)]].filter(x => x[1] !== x[2]);
      audit(action, 'App Settings', { id: 'maintenance', label: 'Maintenance' }, ch, why ? { reason: why } : {});
      location.reload();
    };
    const startNow = (v) => confirm({ title: 'Start maintenance now?', body: 'It starts straight away.', reason: true, confirm: 'Start maintenance',
      impact: ['Goes into maintenance: ' + esc(names(v)) + '.', v.scope.includes('web') ? 'Staff are stopped on their next action, except: ' + esc(v.exemptRoles.map(id => (L.role(id) || {}).name).join(', ')) + '.' : 'The staff web portal keeps working.', v.scope.some(s => MOBILE.includes(s)) ? 'Patients who open the app see the maintenance message.' : '', 'Ends: ' + esc(UI.fmtLocal(v.to)) + '.'].filter(Boolean),
      onConfirm: (why) => commit(Object.assign(v, { on: true, from: '' }), 'Maintenance started', why) });
    if ($('#mGo')) $('#mGo').addEventListener('click', () => { const v = read(); if (when === 'later') commit(Object.assign(v, { on: true }), 'Maintenance scheduled'); else startNow(v); });
    if ($('#mSave')) $('#mSave').addEventListener('click', () => commit(Object.assign(read(), { on: true }), 'Maintenance changed'));
    if ($('#mReset')) $('#mReset').addEventListener('click', drawMaint);
    if ($('#mNowBtn')) $('#mNowBtn').addEventListener('click', () => { when = 'now'; startNow(read()); });
    if ($('#mEnd')) $('#mEnd').addEventListener('click', () => confirm({ title: 'End maintenance?', body: 'Everybody can use ' + esc(where) + ' again.', tone: 'primary', icon: 'power', confirm: 'End maintenance', onConfirm: () => commit({ on: false }, 'Maintenance ended') }));
    if ($('#mCancel')) $('#mCancel').addEventListener('click', () => confirm({ title: 'Cancel the scheduled maintenance?', body: 'Nothing goes into maintenance.', confirm: 'Cancel schedule', cancel: 'Keep', onConfirm: () => commit({ on: false }, 'Maintenance schedule cancelled') }));
  }

  drawTab();   // last, after every helper above is defined
}
</script>
</body>
</html>
