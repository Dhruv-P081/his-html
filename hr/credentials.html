<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licences and Credentials · Tibbi Orbit</title>
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script><script src="../assets/data.js"></script><script src="../assets/data-core.js"></script><script src="../assets/data-settings.js"></script><script src="../assets/data-hr.js"></script><script src="../assets/ui.js"></script><script src="../assets/kit.js"></script><script src="../assets/hr.js"></script>
<style>.nw{white-space:nowrap}</style>
</head>
<body>
<script>
(function () {
  const { db, save, esc, icon, $, $$, R, can, toast, audit, field, showErrors, drawer } = UI;
  const OPT = 'hr.cred';
  if (!UI.page({ opt: OPT, title: 'Licences and Credentials', subtitle: 'MOH licences, nursing registration, BLS and ACLS, malpractice insurance. Alerts at 90, 60 and 30 days before expiry.',
    actions: `<button class="btn" id="exp">${icon('file-spreadsheet')} Export</button>${HR.btn(OPT, 'add', 'Add credential', 'id="add"', 'primary', 'plus')}` })) return;
  const T = db.TODAY;
  const empF = UI.param('emp');
  let tab = empF ? 'all' : 'due';
  const list = () => HR.credentials().filter(c => !empF || c.empId === empF);
  const inTab = (c, t) => { const b = HR.credBand(c).band; return t === 'all' || (t === 'due' && b !== 'Valid') || (t === 'exp' && b === 'Expired') || (t === 'd30' && b === '30 days') || (t === 'd60' && b === '60 days') || (t === 'd90' && b === '90 days') || (t === 'valid' && b === 'Valid'); };
  const counts = (t) => list().filter(c => inTab(c, t)).length;
  $('#page').innerHTML = `
    ${empF ? `<div class="banner info" style="margin-bottom:12px">${icon('funnel')}<span>Showing credentials of <b>${esc(HR.name(empF))}</b>. <a href="${R('hr/credentials.html')}">Show all staff</a></span></div>` : ''}
    <div class="grid g4" style="margin-bottom:14px" id="kpis"></div>
    <div class="banner info" style="margin-bottom:14px">${icon('bell-ring')}<span>Expiry alerts go to the employee, the line manager and HR at 90, 60 and 30 days before expiry, then daily once expired. Clinical staff with an expired MOH licence are flagged on the duty roster.</span></div>
    <div id="tabs" style="margin-bottom:12px"></div><div id="tbl"></div>`;
  const drawKpis = () => {
    $('#kpis').innerHTML = [['exp', 'Expired', 'circle-x', 'Renew before the next shift'], ['d30', 'Within 30 days', 'alarm-clock', 'Final alert sent'], ['d60', '31 to 60 days', 'clock', 'Second alert sent'], ['d90', '61 to 90 days', 'calendar-clock', 'First alert sent']]
      .map(([t, l, ic, f]) => Kit.kpi(l, counts(t), { icon: ic, foot: f })).join('');
    $$('#kpis .kpi').forEach((k, i) => { k.style.cursor = 'pointer'; k.addEventListener('click', () => tabsCtl.set(['exp', 'd30', 'd60', 'd90'][i])); });
  };
  const TABS = () => [['due', 'Due in 90 days'], ['exp', 'Expired'], ['d30', '30 days'], ['d60', '60 days'], ['d90', '90 days'], ['valid', 'Valid'], ['all', 'All']].map(([id, label]) => ({ id, label, count: counts(id) }));
  let tb;
  const tabsCtl = { set: (t) => { tab = t; drawTabs(); tb.redraw(); } };
  const drawTabs = () => Kit.tabs($('#tabs'), TABS(), tab, (t) => { tab = t; tb.redraw(); });
  drawTabs(); drawKpis();
  tb = UI.table($('#tbl'), {
    rows: () => list().filter(c => inTab(c, tab)).sort((a, b) => a.expiry.localeCompare(b.expiry)),
    search: (c) => [HR.name(c.empId), c.type, c.number, c.issuer].join(' '), searchPlaceholder: 'Employee, credential or number',
    filters: [
      { label: 'Type', options: HR.CRED_TYPES.map(x => [x, x]), test: (c, x) => c.type === x },
      { label: 'Department', options: HR.deptsInUse(), test: (c, x) => HR.prof(c.empId).deptId === x },
      { label: 'Category', options: ['Doctor', 'Nurse', 'Allied health'].map(x => [x, x]), test: (c, x) => HR.prof(c.empId).category === x },
    ],
    columns: [
      { label: 'Employee', sort: (c) => HR.name(c.empId), render: (c) => HR.empCell(HR.get(c.empId)) },
      { label: 'Credential', sort: (c) => c.type, render: (c) => `<b class="nw">${esc(c.type)}</b><div class="small muted mono">${esc(c.number)}</div>` },
      { label: 'Issuer', render: (c) => `<span class="small">${esc(c.issuer)}</span>` },
      { label: 'Expiry', sort: (c) => c.expiry, render: (c) => `<span class="nw">${esc(Kit.day(c.expiry))}</span>` },
      { label: 'Status', sort: (c) => HR.credBand(c).days, render: (c) => { const b = HR.credBand(c); return `<span class="badge b-${b.tone} nw">${esc(b.label)}</span>`; } },
      { label: 'Alerts sent', render: (c) => (c.reminders || []).length ? (c.reminders || []).slice(-2).map(r => `<span class="tag nw">${icon('bell')} ${esc(r.band)}</span>`).join(' ') : '<span class="muted small">None</span>' },
      { label: '', cls: 'actions', render: (c) => `<button class="btn xs" data-renew="${c.id}" ${can(OPT, 'edit') ? '' : 'disabled title="Needs Edit permission"'}>${icon('refresh-cw')} Renew</button>` },
    ],
    onRow: (c) => detail(c.id), empty: 'No credentials in this view', emptyIcon: 'id-card', pageSize: 12,
    afterDraw: (body) => $$('[data-renew]', body).forEach(b => b.addEventListener('click', () => renew(find(b.dataset.renew)))),
  });
  const find = (id) => HR.credentials().find(c => c.id === id);
  const refresh = () => { drawTabs(); drawKpis(); tb.redraw(); };

  function detail(id) {
    const c = find(id); const b = HR.credBand(c), v = HR.get(c.empId);
    drawer({ title: c.type, sub: esc(v.name) + ' · ' + esc(v.empNo), wide: true,
      body: `<div class="banner ${b.tone === 'ok' ? 'ok' : b.tone === 'err' ? 'err' : 'warn'}" style="margin-bottom:14px">${icon(b.tone === 'ok' ? 'circle-check' : 'triangle-alert')}<span><b>${esc(b.band === 'Valid' ? 'Valid' : b.band === 'Expired' ? 'Expired' : 'Expires within ' + b.band)}</b> · ${esc(b.label)}</span></div>
        <dl class="kv"><dt>Employee</dt><dd>${HR.empLink(c.empId)} · ${esc(v.designation)}</dd><dt>Department</dt><dd>${esc(HR.dept(v.deptId))}</dd><dt>Number</dt><dd class="mono">${esc(c.number)}</dd><dt>Issuer</dt><dd>${esc(c.issuer)}</dd>${c.scope ? `<dt>Scope of practice</dt><dd>${esc(c.scope)}</dd>` : ''}<dt>Issued</dt><dd>${esc(Kit.day(c.issued))}</dd><dt>Expiry</dt><dd>${esc(Kit.day(c.expiry))}</dd></dl>
        <div class="grid g2" style="margin-top:16px"><div class="card"><div class="card-head"><h3>${icon('history')} Renewals</h3></div><div class="card-pad">${(c.renewals || []).length ? `<div class="timeline">${c.renewals.slice().reverse().map(r => `<div class="tl-item ok"><b>Renewed to ${esc(Kit.day(r.newExpiry))}</b><div class="meta">${esc(Kit.when(r.at))} · ${esc(r.by)}</div><div class="small">Previous expiry ${esc(Kit.day(r.oldExpiry))}${r.newNo !== r.oldNo ? ` · number ${esc(r.oldNo)} to ${esc(r.newNo)}` : ''}${r.file ? ` · ${esc(r.file)}` : ''}</div>${r.note ? `<div class="small muted">${esc(r.note)}</div>` : ''}</div>`).join('')}</div>` : '<div class="muted small">No renewals recorded yet.</div>'}</div></div>
        <div class="card"><div class="card-head"><h3>${icon('bell')} Alerts sent</h3></div><div class="card-pad">${(c.reminders || []).length ? `<div class="timeline">${c.reminders.slice().reverse().map(r => `<div class="tl-item"><b>${esc(r.band)} alert</b><div class="meta">${esc(Kit.when(r.at))} · to ${esc(r.to)}</div></div>`).join('')}</div>` : '<div class="muted small">No alerts yet. The first alert goes 90 days before expiry.</div>'}</div></div></div>`,
      foot: `<button class="btn" data-close>Close</button><span class="grow"></span>${b.band !== 'Valid' ? HR.btn(OPT, 'edit', 'Send reminder now', 'id="cRem"', '', 'send') : ''}${HR.btn(OPT, 'edit', 'Record renewal', 'id="cRen"', 'primary', 'refresh-cw')}`,
      onMount: (el, close) => {
        const rn = $('#cRen', el); if (rn) rn.addEventListener('click', () => { close(); renew(c); });
        const rm = $('#cRem', el); if (rm) rm.addEventListener('click', () => {
          c.reminders = (c.reminders || []).concat([{ at: UI.nowStamp(), band: b.band === 'Expired' ? 'Expired' : b.band, to: 'Employee, line manager and HR (manual)' }]); save();
          audit('Sent credential reminder', 'Credential', { id: c.id, label: c.type + ' ' + v.name }, [['Reminder', '', b.label]]);
          toast('Reminder sent to ' + v.name); close(); refresh(); detail(c.id);
        });
      } });
  }

  function renew(c) {
    const v = HR.get(c.empId);
    drawer({ title: 'Record renewal', sub: esc(c.type) + ' · ' + esc(v.name),
      body: `<div class="err-summary hidden"></div><dl class="kv tight" style="margin-bottom:14px"><dt>Current number</dt><dd class="mono">${esc(c.number)}</dd><dt>Current expiry</dt><dd>${esc(Kit.day(c.expiry))} ${HR.credBand(c).band !== 'Valid' ? `<span class="badge b-${HR.credBand(c).tone}">${esc(HR.credBand(c).label)}</span>` : ''}</dd></dl>
        <div class="form-grid">${field({ id: 'r_no', label: 'Licence or certificate number', value: c.number, req: true })}${field({ id: 'r_iss', label: 'Issue date', type: 'date', value: T, req: true })}
        ${field({ id: 'r_exp', label: 'New expiry date', type: 'date', value: '', req: true })}
        <div class="field"><label for="r_file">Renewed document<span class="req">*</span></label><input class="input" type="file" id="r_file" accept=".pdf,.jpg,.jpeg,.png"><div class="err hidden" data-err="r_file"></div></div>
        ${field({ id: 'r_note', label: 'Note', type: 'textarea', full: true })}</div>`,
      foot: `<button class="btn" data-close>Cancel</button><span class="grow"></span><button class="btn primary" id="rSave" disabled>${icon('check')} Save renewal</button>`,
      onMount: (el, close) => {
        const sv = $('#rSave', el);
        const chk = () => { sv.disabled = !($('#r_no', el).value.trim() && $('#r_iss', el).value && $('#r_exp', el).value && $('#r_file', el).files.length); };
        $$('input,textarea', el).forEach(i => { i.addEventListener('input', chk); i.addEventListener('change', chk); });
        sv.addEventListener('click', () => {
          const errs = {}, exp = $('#r_exp', el).value, iss = $('#r_iss', el).value;
          if (exp <= T) errs.r_exp = 'New expiry must be after today.';
          else if (exp <= c.expiry) errs.r_exp = 'New expiry must be after the current expiry (' + Kit.day(c.expiry) + ').';
          if (iss > T) errs.r_iss = 'Issue date cannot be in the future.';
          if (!showErrors(el, errs)) return;
          const r = { at: UI.nowStamp(), by: UI.me().displayName, oldExpiry: c.expiry, newExpiry: exp, oldNo: c.number, newNo: $('#r_no', el).value.trim(), file: $('#r_file', el).files[0].name, note: $('#r_note', el).value.trim() };
          c.renewals = (c.renewals || []).concat([r]); c.expiry = exp; c.issued = iss; c.number = r.newNo; c.reminders = [];
          const p = HR.prof(c.empId); p.documents = (p.documents || []).concat([{ id: UI.uid('hdc'), type: c.type === 'MOH professional licence' ? 'MOH licence copy' : 'Other', number: r.newNo, expiry: exp, file: r.file, uploadedBy: r.by, uploadedAt: r.at }]);
          save(); audit('Recorded credential renewal', 'Credential', { id: c.id, label: c.type + ' ' + v.name }, [['Expiry', r.oldExpiry, exp], ['Number', r.oldNo, r.newNo]]);
          close(); toast('Renewal recorded. Valid to ' + Kit.day(exp)); refresh();
        });
      } });
  }

  function add() {
    drawer({ title: 'Add credential', sub: 'Licence, certificate or insurance for an employee.',
      body: `<div class="err-summary hidden"></div><div class="form-grid">
        ${field({ id: 'a_emp', label: 'Employee', type: 'select', options: HR.empOpts(), value: empF || '', req: true, full: true })}
        ${field({ id: 'a_type', label: 'Credential type', type: 'select', options: HR.CRED_TYPES.map(x => [x, x]), req: true })}${field({ id: 'a_no', label: 'Number', req: true })}
        ${field({ id: 'a_issuer', label: 'Issuer', req: true })}${field({ id: 'a_scope', label: 'Scope of practice', hint: 'For MOH licences' })}
        ${field({ id: 'a_iss', label: 'Issue date', type: 'date', req: true })}${field({ id: 'a_exp', label: 'Expiry date', type: 'date', req: true })}
        <div class="field full"><label for="a_file">Document<span class="req">*</span></label><input class="input" type="file" id="a_file" accept=".pdf,.jpg,.jpeg,.png"></div></div>`,
      foot: `<button class="btn" data-close>Cancel</button><span class="grow"></span><button class="btn primary" id="aSave" disabled>${icon('plus')} Add credential</button>`,
      onMount: (el, close) => {
        const ISS = { 'MOH professional licence': 'Ministry of Health, Licensing Department', 'Nursing registration': 'MOH Nursing Services', BLS: 'American Heart Association', ACLS: 'American Heart Association', PALS: 'American Heart Association', 'Malpractice insurance': 'Gulf Insurance Group', 'Radiation safety certificate': 'Kuwait Radiation Protection Department' };
        const sv = $('#aSave', el), ids = ['a_emp', 'a_type', 'a_no', 'a_issuer', 'a_iss', 'a_exp'];
        const chk = () => { sv.disabled = ids.some(i => !$('#' + i, el).value.trim()) || !$('#a_file', el).files.length; };
        $('#a_type', el).addEventListener('change', () => { if (!$('#a_issuer', el).value) $('#a_issuer', el).value = ISS[$('#a_type', el).value] || ''; });
        $$('input,select', el).forEach(i => { i.addEventListener('input', chk); i.addEventListener('change', chk); });
        sv.addEventListener('click', () => {
          const g = (i) => $('#' + i, el).value.trim(), errs = {};
          if (g('a_exp') <= g('a_iss')) errs.a_exp = 'Expiry must be after the issue date.';
          if (g('a_iss') > T) errs.a_iss = 'Issue date cannot be in the future.';
          if (HR.credentials().some(c => c.empId === g('a_emp') && c.type === g('a_type'))) errs.a_type = 'This employee already has this credential. Record a renewal instead.';
          if (!showErrors(el, errs)) return;
          const p = HR.prof(g('a_emp'));
          const c = { id: UI.uid('hcr'), empId: g('a_emp'), type: g('a_type'), number: g('a_no'), issuer: g('a_issuer'), issued: g('a_iss'), expiry: g('a_exp'), scope: g('a_scope'), renewals: [], reminders: [] };
          p.licences = (p.licences || []).concat([c]); save();
          audit('Added credential', 'Credential', { id: c.id, label: c.type + ' ' + HR.name(c.empId) }, [['Expiry', '', c.expiry]]);
          close(); toast('Credential added'); refresh();
        });
      } });
  }
  const a = $('#add'); if (a) a.addEventListener('click', add);
  $('#exp').addEventListener('click', () => Kit.csv('credentials', ['Employee no.', 'Employee', 'Department', 'Credential', 'Number', 'Issuer', 'Expiry', 'Days left'], list().map(c => { const v = HR.get(c.empId); return [v.empNo, v.name, HR.dept(v.deptId), c.type, c.number, c.issuer, c.expiry, HR.credBand(c).days]; })));
  const qid = UI.param('id'); if (qid && find(qid)) detail(qid);
})();
</script>
</body>
</html>
